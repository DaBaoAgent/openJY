# 来华就医引流（China Medical Journey）—— Claims Registry（唯一权威机器可读事实源）
#
# 用途：就医引流短视频的「对外可说法」唯一来源。Script / Packaging / Engage 一律只能经
#       lib/claims.py 读取本文件，不得在别处内置第二套说法。
#
# ⚠️ 医疗红线（本文件永远不许出现）：
#   · 疗效承诺 / 治愈率 / 包治 / 保证治好（kind=medical 一律 forbidden）
#   · 具体报价 / 折扣 / 补贴（价格只能写「参考区间，以医院报价为准」，且不落具体数字）
#   · 绝对化用语：最好 / 第一 / 唯一 / 100% / 顶级（广告法）
#   · 未证实的认证 / 专利 / 排名（无证书一律 needs_verification，禁止自动对外）
#
# 说明：本批 claims 全部为**服务/流程/资源类**描述（非参数、非疗效），故可标 verified；
#       一旦涉及具体数字（等待天数、费用、成功率等）必须改 needs_verification 并注明材料。
#
# status 三态：
#   verified           —— 有单一权威证据，可自动对外使用
#   needs_verification —— 口径不清/缺材料，禁止自动对外使用，必须人工核对后才 available
#   forbidden          —— 法规/合规原因禁止自动生成
